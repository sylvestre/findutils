[package]
name = "findutils"
version = "0.8.0"
homepage = "https://github.com/uutils/findutils"
repository = "https://github.com/uutils/findutils"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "Rust implementation of GNU findutils"
authors = ["uutils developers"]

[dependencies]
chrono = "0.4.44"
clap = "4.6"
regex = "1.12"
walkdir = "2.5"

# onig (Oniguruma C library) does not compile for WASI
[target.'cfg(not(target_os = "wasi"))'.dependencies]
onig = { version = "6.5", default-features = false }

# Platform-specific dependencies: Unix-only
[target.'cfg(unix)'.dependencies]
argmax = "0.4.0"
faccess = "0.2.4"
nix = { version = "0.31", features = ["fs", "user"] }
uucore = { version = "0.7.0", features = ["entries", "fs", "fsext", "mode"] }


[dev-dependencies]
ctor = "0.8"
filetime = "0.2"
nix = { version = "0.31", features = ["fs"] }
tempfile = "3"
uutests = "0.7.0"

[[bin]]
name = "find"
path = "src/find/main.rs"

[[bin]]
name = "xargs"
path = "src/xargs/main.rs"

[[bin]]
name = "testing-commandline"
path = "src/testing/commandline/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
panic = "abort"

[lints.clippy]
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
uninlined_format_args = "allow"
missing_panics_doc = "allow"

use_self = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
manual_let_else = "warn"
# Disable for now, we have a few occurrences
# panic = "warn"
